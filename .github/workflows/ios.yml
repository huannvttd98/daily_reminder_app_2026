# Build file .ipa chưa ký trên máy macOS của GitHub, để cài bằng Sideloadly.
name: Build iOS (IPA chưa ký)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --release --no-codesign

      - name: Đóng gói IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry daily_reminder_app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: daily_reminder_app-ipa
          path: daily_reminder_app.ipa
          retention-days: 14
